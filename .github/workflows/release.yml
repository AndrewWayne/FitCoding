name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Allow manual trigger for CI smoke-testing on a branch.
  workflow_dispatch:

permissions:
  contents: write

# Don't race tag re-pushes against each other; let the first finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            ext: ".exe"
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            ext: ""
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
            ext: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            ext: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Verify frontendDist exists
        shell: bash
        run: |
          ls -la app/dist
          test -f app/dist/index.html

      - name: Build Rust binary
        working-directory: app/src-tauri
        run: cargo build --release --locked --target ${{ matrix.target }} --verbose

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          BIN_NAME="fitcoding${{ matrix.ext }}"
          SRC="app/src-tauri/target/${{ matrix.target }}/release/${BIN_NAME}"
          STAGE="dist/fitcoding-${{ matrix.target }}"
          mkdir -p "${STAGE}"
          cp "${SRC}" "${STAGE}/"
          cp LICENSE "${STAGE}/"
          cp README.md "${STAGE}/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && 7z a "fitcoding-${{ matrix.target }}.zip" "fitcoding-${{ matrix.target }}/*")
          else
            tar -czf "dist/fitcoding-${{ matrix.target }}.tar.gz" -C dist "fitcoding-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fitcoding-${{ matrix.target }}
          path: dist/fitcoding-${{ matrix.target }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      # Note: no actions/checkout — softprops/action-gh-release uses the
      # GitHub API to attach assets to the tag, no local refs needed.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
