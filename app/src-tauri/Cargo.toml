[package]
name = "fitcoding"
version = "0.0.5"
edition = "2021"
description = "FitCoding — /fit pop-up exercise mini-game for Claude Code"
license = "MIT"

[[bin]]
name = "fitcoding"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `custom-protocol` is REQUIRED for plain `cargo build --release` to serve
# the embedded frontendDist instead of trying to reach devUrl (localhost:1420).
# Without it, release binaries silently fall back to devUrl and fail with
# "localhost refused the connection" on every launch. `cargo tauri build`
# enables this feature implicitly via `--features tauri/custom-protocol`,
# but our CI uses plain cargo, so we declare it here.
tauri = { version = "2", features = ["custom-protocol", "macos-private-api"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
anyhow = "1"
rand = "0.8"
dirs = "5"

# macOS-only: embed Info.plist into the Mach-O binary so unbundled releases
# can request camera access. macOS TCC reads NSCameraUsageDescription from
# the __TEXT,__info_plist section; without it the OS silently denies
# getUserMedia. Target-gated so Windows/Linux never pull this dep.
[target.'cfg(target_os = "macos")'.dependencies]
embed_plist = "1.2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
